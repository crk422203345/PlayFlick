<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PlayFlick 汇集热门微短剧与即点即玩的精品小游戏。" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>首页 | PlayFlick</title>
    <script>
      ;(function () {
        let savedTheme = null
        try {
          savedTheme = localStorage.getItem('playflick_theme')
        } catch {}

        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)

        const link = document.querySelector("link[rel*='icon']")
        if (link) {
          link.href = theme === 'dark' ? '/favicon-dark.svg' : '/favicon-light.svg'
        }

        const themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) {
          themeColor.content = theme === 'dark' ? '#090a1a' : '#f5f5f7'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
