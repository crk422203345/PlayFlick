<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cir Tabs Demo — 标签页切换特效演示</title>
  <style>
    /* From Uiverse.io by user */
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap");

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f3f4f6;
      gap: 20px;
    }

    .demo-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.025);
    }

    /* ==========================
       Uiverse.io CSS Code
       ========================== */
    .cir-tabs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: var(--color-cloud, #ffffff);
      border: 1px solid var(--color-edge, #e3e8ee);
      border-radius: 999px;
      box-shadow:
        0 1px 1px rgba(14, 17, 22, 0.04),
        0 20px 40px -24px rgba(14, 17, 22, 0.18);
      font-family:
        "Inter",
        system-ui,
        -apple-system,
        sans-serif;
    }

    .cir-tabs__r {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .cir-tabs__t {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-mist, #5b6472);
      cursor: pointer;
      white-space: nowrap;
      transition:
        background-color 220ms cubic-bezier(0.22, 1, 0.36, 1),
        color 220ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cir-tabs__t:hover {
      color: var(--color-ink, #0e1116);
    }

    .cir-tabs__r:checked + .cir-tabs__t {
      background: var(--color-ink, #0e1116);
      color: var(--color-cloud, #ffffff);
      box-shadow:
        0 1px 1px rgba(14, 17, 22, 0.06),
        0 8px 18px -10px rgba(14, 17, 22, 0.5);
    }

    .cir-tabs__r:focus-visible + .cir-tabs__t {
      box-shadow: 0 0 0 3px rgba(46, 125, 239, 0.32);
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <div class="cir-tabs" role="tablist" aria-label="Range">
      <input class="cir-tabs__r" type="radio" name="cir-range" id="cir-r-day" />
      <label class="cir-tabs__t" for="cir-r-day" role="tab">Day</label>

      <input
        class="cir-tabs__r"
        type="radio"
        name="cir-range"
        id="cir-r-week"
        checked=""
      />
      <label class="cir-tabs__t" for="cir-r-week" role="tab">Week</label>

      <input class="cir-tabs__r" type="radio" name="cir-range" id="cir-r-month" />
      <label class="cir-tabs__t" for="cir-r-month" role="tab">Month</label>

      <input class="cir-tabs__r" type="radio" name="cir-range" id="cir-r-year" />
      <label class="cir-tabs__t" for="cir-r-year" role="tab">Year</label>
    </div>
  </div>

</body>
</html>
