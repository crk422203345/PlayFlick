<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayFlick — 游戏入口按钮特效演示</title>
  <style>
    /* =============================================
       全局重置 & 页面布局
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      background: #090a1a;
      color: #f2f2f7;
      padding: 40px 20px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(242,242,247,0.45);
    }

    .demo-row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 11px;
      color: rgba(242,242,247,0.38);
      text-align: center;
      margin-top: 10px;
    }

    /* =============================================
       按钮基础结构 — 源自 Uiverse.io by Ali-Tahmazi99
       颜色已适配 PlayFlick 游戏区主题 (teal 青绿系)
    ============================================= */
    .game-sweep-btn {
      display: inline-block;
      width: 150px;
      height: 44px;
      border-radius: 10px;
      border: 1.5px solid #00bfa5;
      position: relative;
      overflow: hidden;
      transition: all 0.5s ease-in;
      z-index: 1;
      cursor: pointer;
      background: transparent;
      font-family: inherit;
    }

    /* 左侧深色扫入块 */
    .game-sweep-btn::before,
    .game-sweep-btn::after {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 100%;
      transform: skew(15deg);
      transition: all 0.5s;
      overflow: hidden;
      z-index: -1;
    }

    .game-sweep-btn::before {
      left: -10px;
      background: #007a6b;   /* 深青绿 — 深色主题左侧 */
    }

    .game-sweep-btn::after {
      right: -10px;
      background: #00bfa5;   /* 主青绿 — 深色主题右侧 */
    }

    .game-sweep-btn:hover::before,
    .game-sweep-btn:hover::after {
      width: 58%;
    }

    .game-sweep-btn:hover span {
      color: #ffffff;
      transition: 0.3s;
    }

    .game-sweep-btn span {
      color: #00e0c5;          /* 文字: 明亮青绿 (深色主题) */
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: all 0.3s ease-in;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 100%;
    }

    /* =============================================
       浅色主题变体 (light theme)
       border / 文字 → 深青绿，扫入块用更浅的渐变
    ============================================= */
    .game-sweep-btn.light {
      border-color: #00897b;
    }

    .game-sweep-btn.light::before {
      background: #00695c;   /* 深茶绿 — 浅色主题左侧 */
    }

    .game-sweep-btn.light::after {
      background: #00897b;   /* 中茶绿 — 浅色主题右侧 */
    }

    .game-sweep-btn.light span {
      color: #004d40;        /* 深绿文字 (浅色主题) */
    }

    .game-sweep-btn.light:hover span {
      color: #ffffff;
    }

    /* =============================================
       全宽版 (卡片内使用)
    ============================================= */
    .game-sweep-btn.full-width {
      width: 100%;
      border-radius: 10px;
    }

    /* =============================================
       主题切换演示
    ============================================= */
    .theme-demo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .theme-box {
      padding: 28px 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .theme-box.dark-box {
      background: #0e0f22;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .theme-box.light-box {
      background: #f5f5f7;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .theme-box .theme-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dark-box .theme-title { color: rgba(242,242,247,0.45); }
    .light-box .theme-title { color: rgba(0,0,0,0.38); }
  </style>
</head>
<body>
  <h1>PlayFlick — 游戏入口按钮特效 · 主题适配演示</h1>

  <div class="theme-demo">
    <!-- 深色主题 -->
    <div class="theme-box dark-box">
      <p class="theme-title">深色主题 · Dark</p>
      <button class="game-sweep-btn">
        <span>⚡ 立即畅玩</span>
      </button>
      <button class="game-sweep-btn">
        <span>进入游戏</span>
      </button>
    </div>

    <!-- 浅色主题 -->
    <div class="theme-box light-box">
      <p class="theme-title">浅色主题 · Light</p>
      <button class="game-sweep-btn light">
        <span>⚡ 立即畅玩</span>
      </button>
      <button class="game-sweep-btn light">
        <span>进入游戏</span>
      </button>
    </div>
  </div>

  <div>
    <p class="label">全宽版 — 卡片内使用 (宽 220px 演示)</p>
    <div style="width: 220px; margin-top: 12px; background: #0e0f22; border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.07)">
      <button class="game-sweep-btn full-width">
        <span>⚡ 立即畅玩</span>
      </button>
    </div>
  </div>

  <p style="font-size:11px; color: rgba(242,242,247,0.25); text-align:center;">
    原始效果来自 Uiverse.io by Ali-Tahmazi99 · PlayFlick 主题适配版
  </p>
</body>
</html>
